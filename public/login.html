<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ログイン | 文字だけポケモン対戦</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0b0d12;color:#edf1f7;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{width:min(1180px,calc(100% - 32px));margin:auto;padding:32px 0 60px}.center{display:grid;place-items:center;padding:20px}.auth-card{width:min(430px,100%);background:#12161d;border:1px solid #2a313d;border-radius:16px;padding:28px}.eyebrow{font-size:11px;letter-spacing:.16em;color:#98a2b3;margin:0 0 8px}h1,h2,h3{margin-top:0}h1{font-size:34px;letter-spacing:-.03em}.muted{color:#98a2b3}.topbar{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:22px}.top-actions,.row,.battle-head{display:flex;gap:10px;align-items:center}.badge{border:1px solid #2a313d;border-radius:999px;padding:6px 10px;color:#b9c2cf;font-size:12px}.panel{background:#12161d;border:1px solid #2a313d;border-radius:16px;padding:22px;margin-bottom:18px}.panel-title{margin-bottom:18px}.panel-title p{margin:6px 0}.party-grid,.move-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.party-card,.fighter,.log,aside{background:#181d26;border:1px solid #2a313d;border-radius:12px;padding:14px}.party-card.selected{border-color:#edf2f7}.party-card h3{margin-bottom:8px}.party-card label{margin-top:8px}label{display:grid;gap:7px;color:#98a2b3;font-size:12px;margin:12px 0}input,select,textarea{width:100%;background:#181d26;border:1px solid #2a313d;border-radius:10px;color:#edf1f7;padding:11px;outline:none}textarea{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}.primary,.secondary,.button{border-radius:10px;padding:11px 15px;border:1px solid #2a313d;text-decoration:none;display:inline-block}.primary{background:#edf2f7;color:#0b0d12;font-weight:800}.secondary{background:#181d26;color:#edf1f7}.error{color:#ff7676;min-height:18px}.hidden{display:none}.battle-grid{display:grid;grid-template-columns:1fr 260px;gap:16px}.fighter{margin-bottom:12px}.fighter h3{margin:10px 0}.hp{height:12px;background:#303642;border-radius:99px;overflow:hidden}.hp i{display:block;height:100%;width:100%;background:#d9e0ea}.log{height:220px;overflow:auto;margin:14px 0;font-size:13px;line-height:1.7}.move-grid{margin-top:10px}.move{border:1px solid #2a313d;background:#181d26;color:#edf1f7;border-radius:10px;padding:13px;text-align:left}.stack{display:grid;gap:8px}.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.user-row,.content-row{display:flex;justify-content:space-between;gap:10px;align-items:center;border-top:1px solid #2a313d;padding:10px 0;font-size:13px}@media(max-width:800px){.party-grid,.move-grid,.admin-grid,.battle-grid{grid-template-columns:1fr}.topbar{flex-direction:column}.app{width:min(100% - 20px,1180px)}}
.selection-area{background:#181d26;border:1px solid #2a313d;border-radius:12px;padding:14px;margin-bottom:12px}
.selection-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:10px 0}.selection-btn{cursor:pointer}.selection-btn span{float:right}
.result{font-size:24px;font-weight:800}.data-form.hidden{display:none}.data-form{margin-top:10px}
button:disabled{opacity:.45;cursor:not-allowed}
.reserve{opacity:.65}

</style>
</head>
<body class="center">
<main class="auth-card">
  <p class="eyebrow">TEXT BATTLE SIMULATOR</p>
  <h1>ログイン</h1>
  <p class="muted">開発者から発行されたアカウントでログインしてください。</p>
  <form id="loginForm">
    <label>ユーザー名<input id="username" autocomplete="username" required></label>
    <label>パスワード<input id="password" type="password" autocomplete="current-password" required></label>
    <button class="primary" type="submit">ログイン</button>
    <p id="error" class="error"></p>
  </form>
</main>
<script>
loginForm.addEventListener("submit", async e => {
  e.preventDefault();
  error.textContent = "ログイン処理中…";
  try {
    const r = await fetch("/api/login", {method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify({username:username.value,password:password.value})});
    const text = await r.text();
    let data = {};
    try { data = text ? JSON.parse(text) : {}; } catch (_) {}
    if (!r.ok) {
      error.textContent = data.error || `ログインAPIエラー（HTTP ${r.status}）`;
      return;
    }
    const meResponse = await fetch("/api/me", {headers:{"Accept":"application/json"}});
    if (meResponse.ok) {
      const me = await meResponse.json();
      location.href = me.role === "developer" ? "/admin" : "/app.html";
    } else {
      const meText = await meResponse.text();
      let meData = {};
      try { meData = meText ? JSON.parse(meText) : {}; } catch (_) {}
      error.textContent = meData.error || `ログイン状態の確認に失敗しました（HTTP ${meResponse.status}）`;
    }
  } catch (err) {
    error.textContent = `通信エラー：${err?.message || "APIに接続できません"}`;
  }
});
</script>
</body>
</html>
