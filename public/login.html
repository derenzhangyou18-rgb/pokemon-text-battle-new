<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ログイン | 文字だけポケモン</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0b0d12;color:#edf1f7;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;place-items:center;padding:20px}.card{width:min(460px,100%);background:#12161d;border:1px solid #2a313d;border-radius:16px;padding:28px}.eyebrow{font-size:11px;letter-spacing:.16em;color:#98a2b3}h1{font-size:34px}.muted{color:#98a2b3;line-height:1.7}label{display:grid;gap:7px;color:#98a2b3;font-size:12px;margin:14px 0}input{width:100%;background:#181d26;border:1px solid #2a313d;border-radius:10px;color:#edf1f7;padding:12px}button{border-radius:10px;padding:12px 16px;border:1px solid #2a313d;cursor:pointer}.primary{background:#edf2f7;color:#0b0d12;font-weight:800}.secondary{background:#181d26;color:#edf1f7}.row{display:flex;gap:8px;flex-wrap:wrap}.error{color:#ff7676;min-height:22px}.ok{color:#8ee6a7;min-height:22px}.note{font-size:12px;color:#98a2b3;background:#181d26;border-radius:10px;padding:12px;margin-top:16px}</style></head>
<body><main class="card"><p class="eyebrow">TEXT BATTLE SIMULATOR</p><h1>ログイン</h1><p class="muted">GitHub Pages + Supabase版です。メールアドレスとパスワードでログインします。</p>
<div id="config" class="error"></div><form id="form"><label>メールアドレス<input id="email" type="email" autocomplete="username" required></label><label>パスワード<input id="password" type="password" autocomplete="current-password" required></label><div class="row"><button class="primary" type="submit">ログイン</button><button class="secondary" type="button" id="signup">新規登録</button><button class="secondary" type="button" id="resend">確認メールを再送</button></div><p id="msg" class="error"></p></form><div class="note">初回は「新規登録」でアカウントを作成します。開発者権限はSupabaseのprofilesテーブルで設定します。</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="supabase-client.js"></script><script>
const $=id=>document.getElementById(id);if(!window.SB_CONFIGURED){$('config').textContent='config.js にSupabaseのURLとPublishable keyを設定してください。'}
async function go(){const {data}=await SB.auth.getSession();if(data.session){const {data:p}=await SB.from('profiles').select('role,enabled,username').eq('id',data.session.user.id).maybeSingle();location.href=p?.role==='developer'&&p?.enabled!==false?'admin.html':'app.html'}}
$('form').addEventListener('submit',async e=>{e.preventDefault();if(!SB){$('msg').textContent='Supabase設定がありません。';return}const email=$('email').value.trim().toLowerCase();$('msg').className='error';$('msg').textContent='ログイン中…';const {error}=await SB.auth.signInWithPassword({email,password:$('password').value});if(error){const m=String(error.message||'');if(/email not confirmed/i.test(m)){ $('msg').textContent='メールアドレスの確認がまだ完了していません。「確認メールを再送」を押して、届いたメールの確認リンクを開いてください。'; }else if(/invalid login credentials/i.test(m)){ $('msg').textContent='メールアドレスまたはパスワードが正しくありません。'; }else{$('msg').textContent=m}return}await go()});
$('signup').onclick=async()=>{if(!SB){$('msg').textContent='Supabase設定がありません。';return}const email=$('email').value.trim().toLowerCase();const password=$('password').value;if(!email||!password){$('msg').textContent='メールアドレスとパスワードを入力してください。';return}if(password.length<6){$('msg').textContent='パスワードは6文字以上にしてください。';return}$('msg').className='ok';$('msg').textContent='登録中…';const username=email.split('@')[0];const redirectTo=location.origin+location.pathname;const {data,error}=await SB.auth.signUp({email,password,options:{data:{username},emailRedirectTo:redirectTo}});if(error){$('msg').className='error';$('msg').textContent=error.message;return}if(data.session){$('msg').textContent='登録しました。';await go()}else{$('msg').textContent='登録しました。確認メールを送信しました。メールの確認リンクを開いたあと、この画面でログインしてください。'}};
$('resend').onclick=async()=>{if(!SB){$('msg').textContent='Supabase設定がありません。';return}const email=$('email').value.trim().toLowerCase();if(!email){$('msg').textContent='メールアドレスを入力してください。';return}$('msg').className='ok';$('msg').textContent='確認メールを再送中…';const {error}=await SB.auth.resend({type:'signup',email,emailRedirectTo:location.origin+location.pathname});if(error){$('msg').className='error';$('msg').textContent=error.message;return}$('msg').textContent='確認メールを再送しました。受信トレイと迷惑メールフォルダを確認してください。'};
go();
</script></body></html>
