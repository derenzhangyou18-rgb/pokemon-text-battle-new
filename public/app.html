<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>対戦 | 文字だけポケモン</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0b0d12;color:#edf1f7;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{width:min(1180px,calc(100% - 32px));margin:auto;padding:32px 0 60px}.center{display:grid;place-items:center;padding:20px}.auth-card{width:min(430px,100%);background:#12161d;border:1px solid #2a313d;border-radius:16px;padding:28px}.eyebrow{font-size:11px;letter-spacing:.16em;color:#98a2b3;margin:0 0 8px}h1,h2,h3{margin-top:0}h1{font-size:34px;letter-spacing:-.03em}.muted{color:#98a2b3}.topbar{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:22px}.top-actions,.row,.battle-head{display:flex;gap:10px;align-items:center}.badge{border:1px solid #2a313d;border-radius:999px;padding:6px 10px;color:#b9c2cf;font-size:12px}.panel{background:#12161d;border:1px solid #2a313d;border-radius:16px;padding:22px;margin-bottom:18px}.panel-title{margin-bottom:18px}.panel-title p{margin:6px 0}.party-grid,.move-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.party-card,.fighter,.log,aside{background:#181d26;border:1px solid #2a313d;border-radius:12px;padding:14px}.party-card.selected{border-color:#edf2f7}.party-card h3{margin-bottom:8px}.party-card label{margin-top:8px}label{display:grid;gap:7px;color:#98a2b3;font-size:12px;margin:12px 0}input,select,textarea{width:100%;background:#181d26;border:1px solid #2a313d;border-radius:10px;color:#edf1f7;padding:11px;outline:none}textarea{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}.primary,.secondary,.button{border-radius:10px;padding:11px 15px;border:1px solid #2a313d;text-decoration:none;display:inline-block}.primary{background:#edf2f7;color:#0b0d12;font-weight:800}.secondary{background:#181d26;color:#edf1f7}.error{color:#ff7676;min-height:18px}.hidden{display:none}.battle-grid{display:grid;grid-template-columns:1fr 260px;gap:16px}.fighter{margin-bottom:12px}.fighter h3{margin:10px 0}.hp{height:12px;background:#303642;border-radius:99px;overflow:hidden}.hp i{display:block;height:100%;width:100%;background:#d9e0ea}.log{height:320px;overflow:auto;margin:14px 0;font-size:13px;line-height:1.7}.move-grid{margin-top:10px}.move{border:1px solid #2a313d;background:#181d26;color:#edf1f7;border-radius:10px;padding:13px;text-align:left}.stack{display:grid;gap:8px}.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.user-row,.content-row{display:flex;justify-content:space-between;gap:10px;align-items:center;border-top:1px solid #2a313d;padding:10px 0;font-size:13px}@media(max-width:800px){.party-grid,.move-grid,.admin-grid,.battle-grid{grid-template-columns:1fr}.topbar{flex-direction:column}.app{width:min(100% - 20px,1180px)}}
.selection-area{background:#181d26;border:1px solid #2a313d;border-radius:12px;padding:14px;margin-bottom:12px}
.selection-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:10px 0}.selection-btn{cursor:pointer}.selection-btn span{float:right}
.result{font-size:24px;font-weight:800}.data-form.hidden{display:none}.data-form{margin-top:10px}
button:disabled{opacity:.45;cursor:not-allowed}.stat-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;margin-top:8px}.stat-line{font-size:12px;padding:5px 7px;border-radius:7px;background:#181d26}.stat-up{color:#ff5b5b}.stat-down{color:#4da3ff}@media(max-width:600px){.stat-list{grid-template-columns:repeat(2,minmax(0,1fr))}}
.reserve{opacity:.65}.party-moves{margin-top:10px;padding-top:8px;border-top:1px solid #2a313d}.party-moves strong{font-size:12px;color:#b9c2cf}.party-moves div{font-size:12px;line-height:1.6;color:#98a2b3}.selection-card{display:flex;flex-direction:column;align-items:flex-start;gap:5px}.selection-card .move-list{font-size:11px;color:#98a2b3;line-height:1.5}

</style>
</head>
<body>
<main class="app">
<header class="topbar">
  <div><p class="eyebrow">TEXT BATTLE SIMULATOR</p><h1>ポケモン対戦シミュレーター</h1><p class="muted">登録済みデータのみ利用できます。</p></div>
  <div class="top-actions"><span id="userBadge" class="badge"></span><button id="logout" class="secondary">ログアウト</button></div>
</header>

<section class="panel">
  <div class="panel-title"><div><h2>6匹パーティ</h2><p>登録済みポケモンから6匹を作り、その中から3匹を選出します。</p></div></div>
  <div id="party" class="party-grid"></div>
  <div class="row"><button id="start" class="primary">3匹を選出して対戦</button><span id="setupError" class="error"></span></div>
</section>

<section id="battle" class="panel hidden">
  <div class="battle-head"><h2>対戦</h2><span id="turn"></span></div>
  <div class="battle-grid">
    <div>
      <div class="fighter"><span class="badge">相手</span><h3 id="enemyName"></h3><div class="hp"><i id="enemyHp"></i></div><p id="enemyHpText" class="muted"></p></div>
      <div class="fighter"><span class="badge">自分</span><h3 id="playerName"></h3><div class="hp"><i id="playerHp"></i></div><p id="playerHpText" class="muted"></p></div>
      <div id="selectionArea" class="selection-area"></div><div id="log" class="log"></div>
      <div id="moves" class="move-grid"></div>
      <div id="megaArea"></div><div id="battleConditions" class="muted"></div>
      <div id="switches" class="move-grid"></div>
    </div>
    <aside><h3>選出</h3><div id="roster"></div></aside>
  </div>
</section>
</main>
<script>
let content=[], species=[], abilities=[], items=[], moveData=[], selectedParty=[], battle=null, selectedForBattle=[];
async function api(url,options={}){const r=await fetch(url,options);if(r.status===401){location.href="/";return null}const d=await r.json();if(!r.ok)throw new Error(d.error||"通信エラー");return d}
function dataOf(x){return x?.data||x}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function moveNames(p){return (p.moves||[]).map(id=>moveData.find(m=>String(dataOf(m).id)===String(id))).filter(Boolean).map(m=>dataOf(m).name||dataOf(m).id);}
const STAT_LABELS={hp:"HP",attack:"攻撃",defense:"防御",spAttack:"特攻",spDefense:"特防",speed:"素早さ"};
function clientStats(p){const ev=p.evs||{},base=p.stats||{};const out={};for(const k of Object.keys(STAT_LABELS)){const raw=Number(base[k]??(k==="hp"?100:70))+20+Math.max(0,Math.min(32,Number(ev[k]??0)));if(k==="hp")out[k]=Number(base[k]??100)+Math.max(0,Math.min(32,Number(ev[k]??0)))+75;else if(p.personality?.up===k)out[k]=Math.floor(raw*1.1);else if(p.personality?.down===k)out[k]=Math.floor(raw*0.9);else out[k]=raw;}return out;}
function statHtml(p){const up=p.personality?.up,down=p.personality?.down;const stats=p.stats||{};return `<div class="stat-list">${Object.entries(STAT_LABELS).map(([k,label])=>`<span class="stat-line ${up===k?"stat-up":""} ${down===k?"stat-down":""}">${label} ${stats[k]??"-"}</span>`).join("")}</div>`;}
function renderParty(){
 party.innerHTML=species.map((s,i)=>{const d=dataOf(s),sel=selectedParty.includes(i),names=moveNames(d),stats=clientStats(d);return `<article class="party-card ${sel?"selected":""}" data-i="${i}"><h3>${esc(d.name)}</h3><div class="muted">${(d.type||[]).join("・")} / 素早さ ${stats.speed}</div><div class="muted">特性: ${(d.abilities||[]).join("・")||"なし"} / 持ち物: ${esc(d.itemId||"なし")}</div>${statHtml({stats,personality:d.personality})}<div class="party-moves"><strong>持っている技</strong><div>${names.length?names.map(esc).join("・"):"なし"}</div></div></article>`}).join("");
 document.querySelectorAll(".party-card").forEach(c=>c.onclick=()=>{const i=Number(c.dataset.i);if(selectedParty.includes(i))selectedParty=selectedParty.filter(x=>x!==i);else if(selectedParty.length<6)selectedParty.push(i);renderParty()});
 setupError.textContent=`6匹パーティ: ${selectedParty.length}/6`;
}
start.onclick=async()=>{if(selectedParty.length!==6){setupError.textContent="登録済みポケモンを6匹選んでください。";return}try{battle=await api("/api/battle/start",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({speciesIds:selectedParty.map(i=>dataOf(species[i]).id)})});selectedForBattle=[];renderSelection()}catch(e){setupError.textContent=e.message}};
function renderSelection(){
 document.getElementById("battle").classList.remove("hidden");
 selectionArea.innerHTML=`<h3>3匹を選出</h3><p class="muted">ポケモン名の下に、そのポケモンが持っている技を表示しています。</p><div class="selection-grid">${selectedParty.map((i,n)=>{const p=dataOf(species[i]),names=moveNames(p),stats=clientStats(p);return `<button class="move selection-btn selection-card" data-sel="${n}"><strong>${esc(p.name)} ${selectedForBattle.includes(n)?"✓":""}</strong>${statHtml({stats,personality:p.personality})}<span class="move-list">技：${names.length?names.map(esc).join("・"):"なし"}</span></button>`}).join("")}</div><button id="confirmSelection" class="primary" ${selectedForBattle.length===3?"":"disabled"}>3匹を決定</button>`;
 document.querySelectorAll("[data-sel]").forEach(b=>b.onclick=()=>{const n=Number(b.dataset.sel);if(selectedForBattle.includes(n))selectedForBattle=selectedForBattle.filter(x=>x!==n);else if(selectedForBattle.length<3)selectedForBattle.push(n);renderSelection()});
 confirmSelection.onclick=async()=>{try{battle=await api("/api/battle/select",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({indexes:selectedForBattle.map(n=>selectedParty[n])})});renderBattle()}catch(e){addLog(e.message)}};
}
function renderBattle(){
 document.getElementById("battle").classList.remove("hidden");if(battle.phase!=="battle"){renderSelection();return}
 const p=battle.player.team[battle.player.active],e=battle.enemy.team[battle.enemy.active];
 playerName.textContent=p.name;enemyName.textContent=e.name;turn.textContent=`ターン ${battle.turn}${battle.weather?` / 天候:${battle.weather}(${battle.weatherTurns})`:""}${battle.field?` / ${battle.field}(${battle.fieldTurns})`:""}`;
 playerHp.style.width=`${Math.max(0,p.hp/p.maxHp*100)}%`;enemyHp.style.width=`${Math.max(0,e.hp/e.maxHp*100)}%`;
 playerHpText.textContent=`HP ${p.hp}/${p.maxHp}${p.status?" / "+p.status:""}${p.choiceMove?" / こだわり中":""}`;enemyHpText.textContent=`HP ${e.hp}/${e.maxHp}${e.status?" / "+e.status:""}`;
 log.innerHTML=battle.log.map((x,i)=>`<div><span class="muted">${i+1}.</span> ${esc(x)}</div>`).join("");log.scrollTop=log.scrollHeight;
 roster.innerHTML=battle.player.team.map((x,i)=>`<div class="user-row ${x.selected?"":"reserve"}"><span>${x.selected?"選出":"非選出"} ${esc(x.name)}${x.mega?" ★メガ":""}</span><span>${x.hp}/${x.maxHp}${x.active?" ←":""}${x.itemLost?" / 持ち物なし":""}</span></div>`).join("");
 moves.innerHTML=(p.moves||[]).map(id=>moveData.find(m=>String(dataOf(m).id)===String(id))).filter(Boolean).map(m=>{const x=dataOf(m);return `<button class="move" data-m="${esc(x.id)}" ${(battle.over||battle.phase!=="battle")?"disabled":""}>${esc(x.name)} <small>${esc(x.type||"")} / ${esc(x.category||"")} / 威力${x.power||0}${x.contact?" / 接触":" / 非接触"} / 対象:${x.target==="self"?"自分":x.target==="field"?"場":"相手"}${(x.effects||x.effect)?" / 効果あり":""}</small></button>`}).join("")||`<p class="muted">技がありません。</p>`;
 const ph=battle.playerHazards||{stealth_rock:false,spikes:0}, eh=battle.enemyHazards||{stealth_rock:false,spikes:0};
 battleConditions.textContent=`${battle.weather?`天候：${battle.weather} ${battle.weatherTurns}ターン　`:""}${battle.field?`フィールド：${battle.field} ${battle.fieldTurns}ターン　`:""}壁：自分 ${Object.entries(battle.playerWalls||{}).filter(([k,v])=>v>0).map(([k,v])=>`${k} ${v}`).join("・")||"なし"} / 相手 ${Object.entries(battle.enemyWalls||{}).filter(([k,v])=>v>0).map(([k,v])=>`${k} ${v}`).join("・")||"なし"} / ステルスロック：自分${ph.stealth_rock?"あり":"なし"}・相手${eh.stealth_rock?"あり":"なし"} / まきびし：自分${ph.spikes||0}・相手${eh.spikes||0}`;
 const megaAvailable= battle.player.team[battle.player.active]?.megaAvailable;
 megaArea.innerHTML=megaAvailable&&!battle.over?`<button class="primary" id="megaBtn">メガ進化</button>`:`${p.mega?"":""}`;
 const megaBtn=document.getElementById("megaBtn"); if(megaBtn) megaBtn.onclick=()=>action({type:"mega"});
 switches.innerHTML=battle.player.team.map((x,i)=>x.selected&&i!==battle.player.active&&x.hp>0?`<button class="move" data-s="${i}" ${battle.over?"disabled":""}>交代: ${esc(x.name)}</button>`:"").join("");
 document.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>action({type:"move",moveId:b.dataset.m}));
 document.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>action({type:"switch",index:Number(b.dataset.s)}));
 if(battle.over){selectionArea.innerHTML=`<p class="result">${battle.result==="win"?"勝利！":"敗北…"}</p>`;}
 else if(battle.phase==="switch_required"){selectionArea.innerHTML=`<div><strong>交代してください</strong><p class="muted">戦闘不能になったポケモンに代わり、HPが残っている選出ポケモンを選んでください。</p></div>`;}
 else {selectionArea.innerHTML="";}
}
async function action(body){try{battle=await api("/api/battle/action",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});renderBattle()}catch(e){addLog(e.message)}}
function addLog(t){log.innerHTML+=`<div>${esc(t)}</div>`;log.scrollTop=log.scrollHeight}
logout.onclick=async()=>{await fetch("/api/logout",{method:"POST"});location.href="/"};
async function init(){const me=await api("/api/me");if(!me)return;userBadge.textContent=`${esc(me.username)} / ${esc(me.role)}`;content=await api("/api/content")||[];species=content.filter(x=>x.kind==="species");abilities=content.filter(x=>x.kind==="ability");items=content.filter(x=>x.kind==="item");moveData=content.filter(x=>x.kind==="move");renderParty();battle=await api("/api/battle");if(battle)renderBattle()}
init();

</script>
</body>
</html>
