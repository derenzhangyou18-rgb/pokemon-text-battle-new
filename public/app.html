<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>対戦 | 文字だけポケモン</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0b0d12;color:#edf1f7;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{width:min(1180px,calc(100% - 32px));margin:auto;padding:32px 0 60px}.topbar{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:22px}.top-actions,.row{display:flex;gap:10px;align-items:center}.eyebrow{font-size:11px;letter-spacing:.16em;color:#98a2b3;margin:0 0 8px}h1,h2,h3{margin-top:0}.muted{color:#98a2b3}.badge{border:1px solid #2a313d;border-radius:999px;padding:6px 10px;color:#b9c2cf;font-size:12px}.panel{background:#12161d;border:1px solid #2a313d;border-radius:16px;padding:22px;margin-bottom:18px}.party-grid,.move-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.party-card,.fighter,.log,aside{background:#181d26;border:1px solid #2a313d;border-radius:12px;padding:14px}.party-card{cursor:pointer}.party-card.selected{border-color:#edf2f7}.primary,.secondary,.move{border-radius:10px;padding:11px 15px;border:1px solid #2a313d}.primary{background:#edf2f7;color:#0b0d12;font-weight:800}.secondary,.move{background:#181d26;color:#edf1f7}.error{color:#ff7676;min-height:20px}.hidden{display:none}.battle-grid{display:grid;grid-template-columns:1fr 260px;gap:16px}.fighter{margin-bottom:12px}.hp{height:12px;background:#303642;border-radius:99px;overflow:hidden}.hp i{display:block;height:100%;width:100%;background:#d9e0ea}.log{height:320px;overflow:auto;margin:14px 0;font-size:13px;line-height:1.7}.selection-area{background:#181d26;border:1px solid #2a313d;border-radius:12px;padding:14px;margin-bottom:12px}.selection-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.selection-card{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left}.stat-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;width:100%}.stat-line{font-size:12px;padding:5px 7px;border-radius:7px;background:#12161d}.stat-up{color:#ff7777}.stat-down{color:#69a9ff}.party-moves{margin-top:8px;padding-top:8px;border-top:1px solid #2a313d;font-size:12px;color:#98a2b3}.user-row{display:flex;justify-content:space-between;gap:8px;border-top:1px solid #2a313d;padding:9px 0;font-size:12px}.reserve{opacity:.6}.result{font-size:24px;font-weight:800}@media(max-width:800px){.party-grid,.move-grid,.battle-grid,.selection-grid{grid-template-columns:1fr}.topbar{flex-direction:column}.app{width:min(100% - 20px,1180px)}}
</style></head><body><main class="app"><header class="topbar"><div><p class="eyebrow">TEXT BATTLE SIMULATOR</p><h1>ポケモン対戦シミュレーター</h1><p class="muted">GitHub Pages + Supabase版。登録データはSupabaseに保存されます。</p></div><div class="top-actions"><span id="userBadge" class="badge"></span><a id="adminLink" class="secondary hidden" href="admin.html">管理</a><button id="logout" class="secondary">ログアウト</button></div></header>
<section class="panel"><h2>6匹パーティ</h2><p class="muted">登録済みポケモンから6匹を作り、その中から3匹を選出します。</p><div id="party" class="party-grid"></div><div class="row"><button id="start" class="primary">3匹を選出して対戦</button><span id="setupError" class="error"></span></div></section>
<section id="battle" class="panel hidden"><h2>対戦 <span id="turn" class="muted"></span></h2><div class="battle-grid"><div><div class="fighter"><span class="badge">相手</span><h3 id="enemyName"></h3><div class="hp"><i id="enemyHp"></i></div><p id="enemyHpText" class="muted"></p></div><div class="fighter"><span class="badge">自分</span><h3 id="playerName"></h3><div class="hp"><i id="playerHp"></i></div><p id="playerHpText" class="muted"></p></div><div id="selectionArea" class="selection-area"></div><div id="log" class="log"></div><div id="moves" class="move-grid"></div><div id="megaArea" style="margin-top:10px"></div><p id="battleConditions" class="muted"></p><div id="switches" class="move-grid"></div></div><aside><h3>選出</h3><div id="roster"></div></aside></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="supabase-client.js"></script><script src="battle-engine.js"></script><script>
const $=id=>document.getElementById(id);let content=[],species=[],moveData=[],selectedParty=[],selectedForBattle=[],battle=null,user=null;const STORE='pokemon-text-battle-state-v5';
const STAT_LABELS={hp:'HP',attack:'攻撃',defense:'防御',spAttack:'特攻',spDefense:'特防',speed:'素早さ'};
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function dataOf(x){return x?.data||x}function moveNames(p){return (p.moves||[]).map(id=>moveData.find(m=>String(dataOf(m).id)===String(id))).filter(Boolean).map(m=>dataOf(m).name||dataOf(m).id)}
function calcStats(p){const ev=p.evs||{},base=p.stats||{},o={};for(const k of Object.keys(STAT_LABELS)){const b=Number(base[k]??(k==='hp'?100:70)),e=Math.max(0,Math.min(32,Number(ev[k]??0)));if(k==='hp')o[k]=b+e+75;else{const raw=b+20+e;o[k]=p.personality?.up===k?Math.floor(raw*1.1):p.personality?.down===k?Math.floor(raw*0.9):raw}}return o}
function statHtml(p){const s=calcStats(p);return '<div class="stat-list">'+Object.entries(STAT_LABELS).map(([k,v])=>`<span class="stat-line ${p.personality?.up===k?'stat-up':''} ${p.personality?.down===k?'stat-down':''}">${v} ${s[k]}</span>`).join('')+'</div>'}
function renderParty(){if(!species.length){$('party').innerHTML='<p class="muted">ポケモンがまだ登録されていません。開発者がSupabaseの管理画面から登録してください。</p>';return}$('party').innerHTML=species.map((s,i)=>{const p=dataOf(s),sel=selectedParty.includes(i);return `<article class="party-card ${sel?'selected':''}" data-i="${i}"><h3>${esc(p.name||p.id)}</h3><div class="muted">${esc((p.type||[]).join('・'))}</div><div class="muted">特性: ${esc((p.abilities||[]).join('・')||'なし')} / 持ち物: ${esc(p.itemId||'なし')}</div>${statHtml(p)}<div class="party-moves"><b>技</b><br>${esc(moveNames(p).join('・')||'なし')}</div></article>`}).join('');document.querySelectorAll('[data-i]').forEach(c=>c.onclick=()=>{const i=Number(c.dataset.i);if(selectedParty.includes(i))selectedParty=selectedParty.filter(x=>x!==i);else if(selectedParty.length<6)selectedParty.push(i);renderParty()});$('setupError').textContent=`6匹パーティ: ${selectedParty.length}/6`}
function saveBattle(){localStorage.setItem(STORE,JSON.stringify(battle))}function loadBattle(){try{return JSON.parse(localStorage.getItem(STORE)||'null')}catch{return null}}function clearBattle(){localStorage.removeItem(STORE)}
function renderSelection(){ $('battle').classList.remove('hidden');$('selectionArea').innerHTML=`<h3>3匹を選出</h3><p class="muted">使用する3匹を選んでください。</p><div class="selection-grid">${selectedParty.map((idx,n)=>{const p=dataOf(species[idx]);return `<button class="move selection-card" data-sel="${n}"><strong>${esc(p.name)} ${selectedForBattle.includes(n)?'✓':''}</strong>${statHtml(p)}<span>技：${esc(moveNames(p).join('・')||'なし')}</span></button>`}).join('')}</div><button id="confirmSelection" class="primary" ${selectedForBattle.length===3?'':'disabled'}>3匹を決定</button>`;document.querySelectorAll('[data-sel]').forEach(b=>b.onclick=()=>{const n=Number(b.dataset.sel);if(selectedForBattle.includes(n))selectedForBattle=selectedForBattle.filter(x=>x!==n);else if(selectedForBattle.length<3)selectedForBattle.push(n);renderSelection()});$('confirmSelection').onclick=()=>{battle.player.selected=selectedForBattle.map(n=>selectedParty[n]);battle.player.active=battle.player.selected[0];battle.phase='battle';battle.log.push(`自分の選出: ${battle.player.selected.map(i=>battle.player.team[i].name).join('・')}`);battle.log.push(`相手の選出: ${battle.enemy.selected.map(i=>battle.enemy.team[i].name).join('・')}`);BattleEngine.applySwitchIn(battle,battle.player);BattleEngine.applySwitchIn(battle,battle.enemy);saveBattle();renderBattle()}}
function renderBattle(){if(!battle)return;if(battle.phase!=='battle'&&!battle.over){renderSelection();return}$('battle').classList.remove('hidden');const pb=BattleEngine.publicBattle(battle),p=pb.player.team[pb.player.active],e=pb.enemy.team[pb.enemy.active];$('playerName').textContent=p.name;$('enemyName').textContent=e.name;$('turn').textContent=`ターン ${pb.turn}${pb.weather?` / 天候:${pb.weather}(${pb.weatherTurns})`:''}${pb.field?` / ${pb.field}(${pb.fieldTurns})`:''}`;$('playerHp').style.width=`${Math.max(0,p.hp/p.maxHp*100)}%`;$('enemyHp').style.width=`${Math.max(0,e.hp/e.maxHp*100)}%`;$('playerHpText').textContent=`HP ${p.hp}/${p.maxHp}${p.status?' / '+p.status:''}`;$('enemyHpText').textContent=`HP ${e.hp}/${e.maxHp}${e.status?' / '+e.status:''}`;$('log').innerHTML=pb.log.map((x,i)=>`<div><span class="muted">${i+1}.</span> ${esc(x)}</div>`).join('');$('log').scrollTop=$('log').scrollHeight;$('roster').innerHTML=pb.player.team.map((x,i)=>`<div class="user-row ${x.selected?'':'reserve'}"><span>${x.selected?'選出':'非選出'} ${esc(x.name)}${x.mega?' ★':''}</span><span>${x.hp}/${x.maxHp}${x.active?' ←':''}</span></div>`).join('');$('moves').innerHTML=(p.moves||[]).map(id=>moveData.find(m=>String(dataOf(m).id)===String(id))).filter(Boolean).map(m=>{const x=dataOf(m);return `<button class="move" data-m="${esc(x.id)}" ${pb.over?'disabled':''}>${esc(x.name)} <small>${esc(x.type||'')} / 威力${x.power||0}</small></button>`}).join('')||'<p class="muted">技がありません。</p>';$('switches').innerHTML=pb.player.team.map((x,i)=>x.selected&&i!==pb.player.active&&x.hp>0?`<button class="move" data-s="${i}" ${pb.over?'disabled':''}>交代: ${esc(x.name)}</button>`:'').join('');const canMega=p.megaAvailable&&!pb.over;$('megaArea').innerHTML=canMega?'<button class="primary" id="megaBtn">メガ進化</button>':'';const mega=$('megaBtn');if(mega)mega.onclick=()=>action({type:'mega'});document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>action({type:'move',moveId:b.dataset.m}));document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>action({type:'switch',index:Number(b.dataset.s)}));$('battleConditions').textContent=`${pb.weather?`天候:${pb.weather} ${pb.weatherTurns}ターン `:''}${pb.field?`フィールド:${pb.field} ${pb.fieldTurns}ターン`:''}`;if(pb.over){$('selectionArea').innerHTML=`<div class="result">${pb.result==='win'?'勝利！':'敗北…'}</div><button class="secondary" id="newBattle">新しい対戦</button>`;$('newBattle').onclick=()=>{clearBattle();location.reload()}}else if(pb.phase==='switch_required')$('selectionArea').innerHTML='<b>交代してください</b>' ;else $('selectionArea').innerHTML=''}
function action(a){try{if(a.type==='mega'){BattleEngine.megaEvolve(battle,battle.player);const em=BattleEngine.chooseEnemyMove(battle);BattleEngine.prepareTurn(battle);BattleEngine.doMove(battle,battle.enemy,battle.player,em);BattleEngine.resolveFaints(battle)}else if(a.type==='switch'){const i=Number(a.index);if(!battle.player.selected.includes(i)||i===battle.player.active||battle.player.hp[i]<=0)throw new Error('そのポケモンには交代できません。');const old=battle.player.team[battle.player.active].name;battle.player.active=i;battle.log.push(`${old}から${battle.player.team[i].name}に交代した。`);BattleEngine.applySwitchIn(battle,battle.player);if(battle.phase==='switch_required'){battle.phase='battle';battle.turn++}else{const em=BattleEngine.chooseEnemyMove(battle);const response={...em,effects:(em.effects||[em.effect]).filter(e=>e!=='attack_then_switch')};response.effect=response.effects[0]||null;BattleEngine.prepareTurn(battle);BattleEngine.doMove(battle,battle.enemy,battle.player,response);BattleEngine.resolveFaints(battle)}}else if(a.type==='move'){BattleEngine.runTurn(battle,String(a.moveId))}else throw new Error('不正な行動です。');saveBattle();renderBattle()}catch(e){$('selectionArea').innerHTML=`<span class="error">${esc(e.message||e)}</span>`}}
async function init(){if(!window.SB_CONFIGURED){$('setupError').textContent='config.js を設定してください。';return}const {data:{session}}=await SB.auth.getSession();if(!session){location.href='login.html';return}const {data:profile}=await SB.from('profiles').select('username,role,enabled').eq('id',session.user.id).single();if(!profile||profile.enabled===false){await SB.auth.signOut();location.href='login.html';return}user=profile;$('userBadge').textContent=`${profile.username} / ${profile.role}`;if(profile.role==='developer')$('adminLink').classList.remove('hidden');const {data,error}=await SB.from('content').select('id,kind,data').order('id');if(error){$('setupError').textContent=error.message;return}content=data||[];species=content.filter(x=>x.kind==='species');moveData=content.filter(x=>x.kind==='move');BattleEngine.setContent(content);renderParty();battle=loadBattle();if(battle){BattleEngine.setContent(content);renderBattle()}}
$('start').onclick=()=>{if(selectedParty.length!==6){$('setupError').textContent='ポケモンを6匹選んでください。';return}try{BattleEngine.setContent(content);battle=BattleEngine.makeBattle(selectedParty.map(i=>dataOf(species[i]).id));selectedForBattle=[];saveBattle();renderSelection()}catch(e){$('setupError').textContent=e.message}};
$('logout').onclick=async()=>{await SB.auth.signOut();clearBattle();location.href='login.html'};init();
</script></body></html>
