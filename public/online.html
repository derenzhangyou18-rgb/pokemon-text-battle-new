<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>オンライン対戦 | 文字だけポケモン</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b0d12;color:#edf1f7;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{width:min(1100px,calc(100% - 24px));margin:auto;padding:24px 0 50px}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.panel{background:#12161d;border:1px solid #2a313d;border-radius:16px;padding:18px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.card,.move{background:#181d26;border:1px solid #2a313d;border-radius:10px;padding:12px;color:#edf1f7}.card{cursor:pointer;text-align:left}.selected{border-color:#edf2f7}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}input,button{font:inherit}input{background:#181d26;border:1px solid #2a313d;border-radius:10px;color:#edf1f7;padding:10px}.primary,.secondary,.move{border-radius:10px;padding:10px 14px;border:1px solid #2a313d}.primary{background:#edf2f7;color:#0b0d12;font-weight:800}.secondary,.move{background:#181d26;color:#edf1f7}.muted{color:#98a2b3}.error{color:#ff7777}.ok{color:#8ee6a7}.hidden{display:none}.hp{height:10px;background:#303642;border-radius:9px;overflow:hidden}.hp i{display:block;height:100%;background:#d9e0ea}.battle{display:grid;grid-template-columns:1fr 1fr;gap:12px}.log{height:280px;overflow:auto;background:#181d26;border:1px solid #2a313d;border-radius:10px;padding:12px;line-height:1.7;font-size:13px}.code{font-size:24px;font-weight:800;letter-spacing:.12em}@media(max-width:700px){.grid,.battle{grid-template-columns:1fr}.top{flex-direction:column}}
</style></head><body><main class="app"><header class="top"><div><p class="muted">ONLINE BATTLE</p><h1>ユーザー同士のオンライン対戦</h1><p class="muted">ログイン中のユーザー同士で、部屋番号を使って対戦できます。</p></div><a class="secondary" href="app.html">通常対戦へ</a></header>
<section id="roomPanel" class="panel"><h2>対戦部屋</h2><div class="row"><button id="create" class="primary">部屋を作る</button><input id="code" placeholder="部屋番号"><button id="join" class="secondary">部屋に参加</button></div><p id="roomMsg" class="muted"></p><div id="roomInfo"></div></section>
<section id="teamPanel" class="panel hidden"><h2>6匹パーティ</h2><div id="team" class="grid"></div><p id="teamCount" class="muted"></p><button id="submitTeam" class="primary">この6匹で参加</button><p id="teamMsg" class="error"></p></section>
<section id="selectPanel" class="panel hidden"><h2>3匹を選出</h2><div id="select" class="grid"></div><p id="selectCount" class="muted"></p><button id="submitSelect" class="primary">3匹を決定</button><p id="selectMsg" class="error"></p></section>
<section id="battlePanel" class="panel hidden"><h2>オンライン対戦 <span id="turn" class="muted"></span></h2><div class="battle"><div class="card"><b>相手</b><h3 id="enemyName"></h3><div class="hp"><i id="enemyHp"></i></div><p id="enemyHpText" class="muted"></p></div><div class="card"><b>自分</b><h3 id="playerName"></h3><div class="hp"><i id="playerHp"></i></div><p id="playerHpText" class="muted"></p></div></div><div id="actionMsg" class="muted"></div><div id="moves" class="grid" style="margin-top:12px"></div><div id="switches" class="grid" style="margin-top:12px"></div><div id="log" class="log" style="margin-top:12px"></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="supabase-client.js"></script><script src="battle-engine.js"></script><script>
const $=id=>document.getElementById(id);let content=[],species=[],moveData=[],user=null,room=null,role=null,team=[],teamSelected=[],battle=null,submitted=false,resolving=false;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const dataOf=x=>x?.data||x;
function msg(t,ok=false){$('roomMsg').className=ok?'ok':'muted';$('roomMsg').textContent=t}function calcStats(p){const ev=p.evs||{},base=p.stats||{},o={};for(const k of ['hp','attack','defense','spAttack','spDefense','speed']){const b=Number(base[k]??(k==='hp'?100:70)),e=Math.max(0,Math.min(32,Number(ev[k]??0)));if(k==='hp')o[k]=b+e+75;else o[k]=b+20+e}return o}
function renderTeam(){ $('team').innerHTML=species.map((r,i)=>{const p=dataOf(r),on=team.includes(i);return `<button class="card ${on?'selected':''}" data-team="${i}"><b>${esc(p.name||p.id)}</b><div class="muted">${esc((p.type||[]).join('・'))}</div><div class="muted">HP ${calcStats(p).hp}</div></button>`}).join('');document.querySelectorAll('[data-team]').forEach(x=>x.onclick=()=>{const i=Number(x.dataset.team);if(team.includes(i))team=team.filter(v=>v!==i);else if(team.length<6)team.push(i);renderTeam();$('teamCount').textContent=`${team.length}/6`});$('teamCount').textContent=`${team.length}/6`}
function renderSelect(){const cards=team.map((idx,n)=>{const p=dataOf(species[idx]);return `<button class="card ${teamSelected.includes(n)?'selected':''}" data-select="${n}"><b>${esc(p.name)}</b><div class="muted">${esc((p.type||[]).join('・'))}</div></button>`}).join('');$('select').innerHTML=cards;document.querySelectorAll('[data-select]').forEach(x=>x.onclick=()=>{const n=Number(x.dataset.select);if(teamSelected.includes(n))teamSelected=teamSelected.filter(v=>v!==n);else if(teamSelected.length<3)teamSelected.push(n);renderSelect()});$('selectCount').textContent=`${teamSelected.length}/3`}
function showTeam(){ $('teamPanel').classList.remove('hidden');renderTeam(); }
function showSelect(){ $('selectPanel').classList.remove('hidden');renderSelect(); }
function publicForMe(){if(!battle)return null;const p=BattleEngine.publicBattle(battle);if(role==='host')return p;return { ...p, player:p.enemy, enemy:p.player };}
function renderBattle(){const p=publicForMe();if(!p)return; $('battlePanel').classList.remove('hidden');const me=p.player.team[p.player.active],op=p.enemy.team[p.enemy.active];$('playerName').textContent=me?.name||'？？？';$('enemyName').textContent=op?.name||'？？？';$('playerHp').style.width=`${Math.max(0,(me?.hp||0)/(me?.maxHp||1)*100)}%`;$('enemyHp').style.width=`${Math.max(0,(op?.hp||0)/(op?.maxHp||1)*100)}%`;$('playerHpText').textContent=`HP ${me?.hp||0}/${me?.maxHp||0}${me?.status?' / '+me.status:''}`;$('enemyHpText').textContent=`HP ${op?.hp||0}/${op?.maxHp||0}${op?.status?' / '+op.status:''}`;$('turn').textContent=`ターン ${p.turn}`;$('log').innerHTML=(p.log||[]).map((x,i)=>`<div>${i+1}. ${esc(x)}</div>`).join('');$('log').scrollTop=$('log').scrollHeight;
 if(p.over){$('actionMsg').textContent=p.result==='win'?(role==='host'?'勝利！':'敗北…'):(p.result==='lose'?(role==='host'?'敗北…':'勝利！'):'対戦終了');$('moves').innerHTML='';$('switches').innerHTML='';return;}
 const localSide=role==='host'?battle.player:battle.enemy;const forcedSide=battle.onlineForcedSwitchSide;
 if(battle.phase==='online_switch_required'){
   const isMe=forcedSide===(role==='host'?'player':'enemy');
   $('moves').innerHTML='';
   if(isMe){
     $('actionMsg').textContent='攻撃後交代です。交代先を選択してください（相手は入力できません）。';
     $('switches').innerHTML=localSide.selected.map(i=>i!==localSide.active&&localSide.hp[i]>0?`<button class="move" data-forced-sw="${i}">交代: ${esc(localSide.team[i].name)}</button>`:'').join('');
     document.querySelectorAll('[data-forced-sw]').forEach(b=>b.onclick=()=>submitForcedSwitch(Number(b.dataset.forcedSw)));
   }else{
     $('actionMsg').textContent='相手が攻撃後の交代先を選択中です。入力はできません。';
     $('switches').innerHTML='';
   }
   return;
 }
 if(localSide.hp[localSide.active]<=0){$('actionMsg').textContent='戦闘不能。交代するポケモンを選択してください。';$('moves').innerHTML='';$('switches').innerHTML=localSide.selected.map(i=>i!==localSide.active&&localSide.hp[i]>0?`<button class="move" data-sw="${i}">交代: ${esc(localSide.team[i].name)}</button>`:'').join('');document.querySelectorAll('[data-sw]').forEach(b=>b.onclick=()=>submitAction({type:'switch',index:Number(b.dataset.sw)}));return;}
 if(submitted){$('actionMsg').textContent='行動を送信しました。相手の選択を待っています。';$('moves').innerHTML='';$('switches').innerHTML='';return;}
 $('actionMsg').textContent='技または交代を選択してください。';$('moves').innerHTML=(me?.moves||[]).map(id=>getMoveLocal(id)).filter(Boolean).map(x=>`<button class="move" data-move="${esc(x.id)}">${esc(x.name)}<br><small>${esc(x.type||'')} / 威力${x.power||0}</small></button>`).join('');$('switches').innerHTML=localSide.selected.map(i=>i!==localSide.active&&localSide.hp[i]>0?`<button class="move" data-sw="${i}">交代: ${esc(localSide.team[i].name)}</button>`:'').join('');document.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>submitAction({type:'move',moveId:b.dataset.move}));document.querySelectorAll('[data-sw]').forEach(b=>b.onclick=()=>submitAction({type:'switch',index:Number(b.dataset.sw)}));}
function getMoveLocal(id){return dataOf(moveData.find(m=>String(dataOf(m).id)===String(id)))}
async function loadRoom(){if(!room)return;const {data,error}=await SB.from('online_battles').select('*').eq('id',room.id).single();if(error||!data)return;room=data;if(room.guest_id&&room.guest_team&&!battle){showSelect();if(role==='host'&&room.host_selected?.length===3&&room.guest_selected?.length===3){battle=BattleEngine.makeOnlineBattle(room.host_team,room.guest_team);BattleEngine.startOnlineSelection(battle,room.host_selected,room.guest_selected);await SB.from('online_battles').update({state:battle,status:'battle',turn:battle.turn,host_action:null,guest_action:null}).eq('id',room.id);}}
 if(room.state){
   battle=room.state;
   BattleEngine.setContent(content);
   // サーバー側で行動が処理されて両方の action が消えたら、
   // クライアント側の submitted ロックも必ず解除する。
   const localAction=role==='host'?room.host_action:room.guest_action;
   if(!localAction && battle.phase==='battle') submitted=false;
   // 攻撃後交代では、交代する側自身が直前の技を「送信済み」にしているため、
   // そのロックを解除しないと交代先ボタンを押せない。
   if(!localAction && battle.phase==='online_switch_required') submitted=false;
   renderBattle();
 }
 if(role==='host'&&room.status==='battle'&&!resolving){
   const ha=room.host_action,ga=room.guest_action;
   const specialSide=ha?.type==='move'&&getMoveLocal(ha.moveId)&&dataOf(getMoveLocal(ha.moveId))?.effects?.includes('attack_then_switch')?'player':(ga?.type==='move'&&getMoveLocal(ga.moveId)&&dataOf(getMoveLocal(ga.moveId))?.effects?.includes('attack_then_switch')?'enemy':null);
   if(specialSide&&room.state&&room.state.phase==='battle'){
     resolving=true;
     try{battle=room.state;BattleEngine.setContent(content);const a=specialSide==='player'?ha:ga;battle=BattleEngine.runOnlineForcedSwitchMove(battle,specialSide,a);await SB.from('online_battles').update({state:battle,status:battle.over?'finished':'battle',turn:battle.turn,host_action:null,guest_action:null}).eq('id',room.id);submitted=false;}finally{resolving=false;}
   }else if(ha&&ga&&room.state&&room.state.phase==='battle'){
     resolving=true;
     try{battle=room.state;BattleEngine.setContent(content);battle=BattleEngine.runOnlineTurn(battle,ha,ga);await SB.from('online_battles').update({state:battle,status:battle.over?'finished':'battle',turn:battle.turn,host_action:null,guest_action:null}).eq('id',room.id);submitted=false;}finally{resolving=false;}
   }
 }
 if(role==='host'&&room.status==='battle'&&room.state?.phase==='online_switch_required'&&room.state?.onlineForcedSwitchSide&&!resolving){
   const fs=room.state.onlineForcedSwitchSide;
   const sa=fs==='player'?room.host_action:room.guest_action;
   if(sa?.type==='switch'){
     resolving=true;
     try{battle=room.state;BattleEngine.setContent(content);battle=BattleEngine.completeOnlineForcedSwitch(battle,fs,sa.index);await SB.from('online_battles').update({state:battle,status:battle.over?'finished':'battle',turn:battle.turn,host_action:null,guest_action:null}).eq('id',room.id);submitted=false;}finally{resolving=false;}
   }
 }
}
async function submitAction(a){if(submitted||!room||!battle||battle.phase==='online_switch_required')return;submitted=true;$('actionMsg').textContent='送信中…';const field=role==='host'?'host_action':'guest_action';const {error}=await SB.from('online_battles').update({[field]:a}).eq('id',room.id);if(error){submitted=false;$('actionMsg').textContent=error.message;return}renderBattle();}
async function submitForcedSwitch(index){if(!room||!battle||battle.phase!=='online_switch_required')return;const me=role==='host'?'player':'enemy';if(battle.onlineForcedSwitchSide!==me)return;submitted=true;$('actionMsg').textContent='交代先を送信中…';const field=role==='host'?'host_action':'guest_action';const {error}=await SB.from('online_battles').update({[field]:{type:'switch',index}}).eq('id',room.id);if(error){submitted=false;$('actionMsg').textContent=error.message;return}renderBattle();}
$('submitTeam').onclick=async()=>{if(team.length!==6){$('teamMsg').textContent='6匹選んでください。';return}const ids=team.map(i=>String(dataOf(species[i]).id));const field=role==='host'?'host_team':'guest_team';const nextStatus=room.guest_id?'selection':'waiting';const {error}=await SB.from('online_battles').update({[field]:ids,status:nextStatus}).eq('id',room.id);if(error){$('teamMsg').textContent=error.message;return}$('teamPanel').classList.add('hidden');msg('パーティを送信しました。相手の参加を待っています。',true);room={...room,[field]:ids,status:nextStatus};if(room.guest_id&&room.guest_team)showSelect();}
$('submitSelect').onclick=async()=>{if(teamSelected.length!==3){$('selectMsg').textContent='3匹選んでください。';return}const sel=[...teamSelected];const field=role==='host'?'host_selected':'guest_selected';const {error}=await SB.from('online_battles').update({[field]:sel}).eq('id',room.id);if(error){$('selectMsg').textContent=error.message;return}$('selectPanel').classList.add('hidden');msg('選出を送信しました。',true);}
$('create').onclick=async()=>{const code=Math.random().toString(36).slice(2,8).toUpperCase();const {data,error}=await SB.from('online_battles').insert({code,host_id:user.id,status:'waiting'}).select().single();if(error){msg(error.message);return}room=data;role='host';$('roomInfo').innerHTML=`<p>部屋番号</p><div class="code">${esc(code)}</div><p class="muted">この番号を対戦相手に伝えてください。</p>`;showTeam();msg('部屋を作成しました。',true);}
$('join').onclick=async()=>{const code=$('code').value.trim().toUpperCase();if(!code){msg('部屋番号を入力してください。');return}msg('部屋を検索しています…');const {data,error}=await SB.from('online_battles').select('*').eq('code',code).eq('status','waiting').is('guest_id',null).maybeSingle();if(error){msg('部屋検索に失敗しました。Supabaseのオンライン対戦用SQLを再実行してください。\n'+error.message);return}if(!data){msg('部屋が見つかりません。部屋番号が正しいか確認してください。');return}if(data.host_id===user.id){msg('自分が作った部屋には参加できません。');return}const {data:upd,error:e}=await SB.from('online_battles').update({guest_id:user.id,status:'selection'}).eq('id',data.id).eq('status','waiting').is('guest_id',null).select('*').maybeSingle();if(e){msg('部屋への参加に失敗しました。Supabaseのオンライン対戦用SQLを再実行してください。\n'+e.message);return}if(!upd){msg('その部屋には先に別のプレイヤーが参加した可能性があります。もう一度お試しください。');return}room=upd;role='guest';$('roomInfo').innerHTML=`<p>部屋番号</p><div class="code">${esc(code)}</div>`;showTeam();msg('部屋に参加しました。',true);}
async function init(){if(!window.SB_CONFIGURED){msg('config.jsを設定してください。');return}const {data:{session}}=await SB.auth.getSession();if(!session){location.href='login.html';return}user=session.user;const {data:c,error}=await SB.from('content').select('id,kind,data').order('id');if(error){msg(error.message);return}content=c||[];species=content.filter(x=>x.kind==='species');moveData=content.filter(x=>x.kind==='move');BattleEngine.setContent(content);setInterval(loadRoom,1200);}
init();</script></body></html>
