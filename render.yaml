services:
  - type: web
    name: pokemon-text-battle-simulator
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: "production"
      - key: DATA_DIR
        value: "/var/data"
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: "deveropper0510"
      - key: ADMIN_PASSWORD
        value: "1"
    disk:
      name: pokemon-data
      mountPath: /var/data
      sizeGB: 1
